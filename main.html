<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock y ventas</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f5;--surface:#fff;--ink:#14282b;--muted:#5d7276;--line:#d9e2e1;--accent:#0f6b63;--accent-ink:#fff;--warn:#b45309;--warn-bg:#fdf0dc;--bad:#b42318;--ok-bg:#dff3ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b1c;--surface:#172829;--ink:#e6f0ef;--muted:#93aaad;--line:#27403f;--accent:#46c2b3;--accent-ink:#06211e;--warn:#f0b35c;--warn-bg:#3a2d17;--bad:#ff8a7a;--ok-bg:#16403b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1b1c;--surface:#172829;--ink:#e6f0ef;--muted:#93aaad;--line:#27403f;--accent:#46c2b3;--accent-ink:#06211e;--warn:#f0b35c;--warn-bg:#3a2d17;--bad:#ff8a7a;--ok-bg:#16403b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:26px;margin:4px 0 14px;letter-spacing:-.02em}
nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
nav button{flex:1;border:0;background:none;color:var(--muted);font:600 14px Figtree,sans-serif;padding:10px 4px;border-radius:9px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
@media(min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;letter-spacing:-.01em}
.stat span{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;margin-bottom:12px}
input,select{width:100%;font:16px Figtree,sans-serif;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px Figtree,sans-serif;padding:10px 14px;border-radius:10px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:7px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.item{display:flex;align-items:center;gap:10px;justify-content:space-between}
.item .name{font-weight:600}
.item .meta{color:var(--muted);font-size:14px}
.qty{min-width:56px;text-align:center;font-weight:700;font-size:18px;padding:4px 8px;border-radius:8px;background:var(--ok-bg)}
.qty.low{background:var(--warn-bg);color:var(--warn)}
.qty.zero{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:32px 12px}
.cart{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:12px;margin-top:14px}
.cart h2,h2{font-size:17px;margin:0 0 8px}
.line{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;cursor:pointer}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:700;margin:10px 0}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:18px;width:min(92vw,400px)}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20}
.sale .top{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.sale .meta{color:var(--muted);font-size:14px}
.void{text-decoration:line-through;opacity:.55}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<div class="wrap">
  <h1>Stock y ventas</h1>
  <div class="row" style="align-items:center;justify-content:space-between;margin-top:-6px"><span id="sync" class="meta" style="color:var(--muted);font-size:14px" role="status"></span><button class="btn sm" id="backup" type="button" style="width:auto">Descargar copia</button></div>
  <nav role="tablist">
    <button role="tab" data-tab="inv" aria-selected="true">Inventario</button>
    <button role="tab" data-tab="sell" aria-selected="false">Vender</button>
    <button role="tab" data-tab="hist" aria-selected="false">Historial</button>
    <button role="tab" data-tab="exp" aria-selected="false">Gastos</button>
  </nav>
  <main id="view"></main>
</div>

<dialog id="pdlg">
  <form method="dialog" id="pform">
    <h2 id="ptitle">Nuevo producto</h2>
    <label for="pname">Nombre</label><input id="pname" required>
    <label for="pprice">Precio de venta ($)</label><input id="pprice" type="number" min="0" step="0.01" inputmode="decimal" required>
    <label for="pstock">Stock actual</label><input id="pstock" type="number" min="0" step="1" inputmode="numeric" required>
    <label for="pmin">Avisar cuando queden</label><input id="pmin" type="number" min="0" step="1" inputmode="numeric" value="3" required>
    <div class="actions" style="margin-top:16px"><button class="btn primary" value="ok">Guardar</button><button class="btn" value="cancel" formnovalidate>Cancelar</button></div>
  </form>
</dialog>
<dialog id="edlg">
  <form method="dialog" id="eform">
    <h2>Nuevo gasto</h2>
    <label for="edesc">Concepto</label><input id="edesc" placeholder="Ej.: alquiler de octubre" required>
    <label for="ecat">Categoría</label>
    <select id="ecat"><option>Alquiler</option><option>Servicios</option><option>Sueldos</option><option>Mercadería</option><option>Transporte</option><option>Impuestos</option><option>Otros</option></select>
    <label for="eamt">Monto ($)</label><input id="eamt" type="number" min="0.01" step="0.01" inputmode="decimal" required>
    <label for="edate">Fecha</label><input id="edate" type="date" required>
    <div class="actions" style="margin-top:16px"><button class="btn primary" value="ok">Guardar gasto</button><button class="btn" value="cancel" formnovalidate>Cancelar</button></div>
  </form>
</dialog>
<dialog id="rdlg">
  <form method="dialog" id="rform">
    <h2 id="rtitle">Agregar stock</h2>
    <label for="rqty">Unidades que ingresan</label><input id="rqty" type="number" min="1" step="1" inputmode="numeric" required>
    <div class="actions" style="margin-top:16px"><button class="btn primary" value="ok">Agregar</button><button class="btn" value="cancel" formnovalidate>Cancelar</button></div>
  </form>
</dialog>

<script>
(function(){
var KEY="stock-ventas-v1";
var S={products:[],sales:[],expenses:[]};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.products&&p.sales){S=p;S.expenses=S.expenses||[];}}}catch(e){}
var dbDoc=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(dbDoc){try{dbDoc.set(JSON.parse(JSON.stringify(S))).catch(function(){setSync("No se pudo sincronizar")})}catch(e){}}}
function setSync(t){var s=document.querySelector("#sync");if(s)s.textContent=t}
var tab="inv",q="",cart={},editId=null,restockId=null;
var $=function(s){return document.querySelector(s)};
var money=function(n){return "$"+Number(n).toLocaleString("es",{minimumFractionDigits:2,maximumFractionDigits:2})};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var find=function(id){return S.products.find(function(p){return p.id===id})};
function toast(t){var d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}
function qcls(p){return p.stock<=0?"zero":(p.stock<=p.min?"low":"")}
function filtered(){var t=q.trim().toLowerCase();return S.products.filter(function(p){return !t||p.name.toLowerCase().indexOf(t)>-1}).sort(function(a,b){return a.name.localeCompare(b.name,"es")})}

function render(){
  document.querySelectorAll("nav button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.tab===tab)});
  var v=$("#view");
  if(tab==="inv")v.innerHTML=inv();else if(tab==="sell")v.innerHTML=sell();else if(tab==="exp")v.innerHTML=exp();else v.innerHTML=hist();
  var s=$("#search");if(s){s.value=q;s.oninput=function(){q=s.value;var pos=s.selectionStart;render();var n=$("#search");n.focus();n.setSelectionRange(pos,pos)}}
}
function inv(){
  var units=0,val=0,low=0;S.products.forEach(function(p){units+=p.stock;val+=p.stock*p.price;if(p.stock<=p.min)low++});
  var list=filtered();
  var h='<div class="stats"><div class="stat"><b>'+S.products.length+'</b><span>Productos</span></div><div class="stat"><b>'+units+'</b><span>Unidades</span></div><div class="stat"><b>'+money(val)+'</b><span>Valor al precio de venta</span></div><div class="stat"><b>'+low+'</b><span>Con stock bajo</span></div></div>';
  h+='<div class="row"><input id="search" type="search" placeholder="Buscar producto" aria-label="Buscar producto"><button class="btn primary" data-a="new">Nuevo producto</button></div>';
  if(!list.length)h+='<div class="empty">'+(S.products.length?"Ningún producto coincide con la búsqueda.":"Todavía no cargaste productos. Toca «Nuevo producto» para empezar.")+'</div>';
  list.forEach(function(p){
    h+='<div class="card"><div class="item"><div><div class="name">'+esc(p.name)+'</div><div class="meta">'+money(p.price)+' c/u'+(p.stock<=p.min&&p.stock>0?" · stock bajo":"")+(p.stock<=0?" · agotado":"")+'</div></div><div class="qty '+qcls(p)+'">'+p.stock+'</div></div>'+
    '<div class="actions"><button class="btn sm primary" data-a="restock" data-id="'+p.id+'">Agregar stock</button><button class="btn sm" data-a="edit" data-id="'+p.id+'">Editar</button><button class="btn sm danger" data-a="del" data-id="'+p.id+'">Eliminar</button></div></div>';
  });
  return h;
}
function cartTotal(){var t=0;Object.keys(cart).forEach(function(id){var p=find(id);if(p)t+=p.price*cart[id]});return t}
function sell(){
  var list=filtered();
  var h='<div class="row"><input id="search" type="search" placeholder="Buscar producto para vender" aria-label="Buscar producto"></div>';
  if(!list.length)h+='<div class="empty">'+(S.products.length?"Ningún producto coincide.":"Primero carga productos en Inventario.")+'</div>';
  list.forEach(function(p){
    var inCart=cart[p.id]||0;
    h+='<div class="card item"><div><div class="name">'+esc(p.name)+'</div><div class="meta">'+money(p.price)+' · disponibles: '+(p.stock-inCart)+'</div></div><button class="btn sm primary" data-a="add" data-id="'+p.id+'"'+(p.stock-inCart<=0?" disabled":"")+'>Agregar</button></div>';
  });
  var ids=Object.keys(cart).filter(function(id){return find(id)});
  if(ids.length){
    h+='<div class="cart"><h2>Venta actual</h2>';
    ids.forEach(function(id){var p=find(id);
      h+='<div class="line"><div><div class="name">'+esc(p.name)+'</div><div class="meta">'+money(p.price*cart[id])+'</div></div><div class="step"><button data-a="dec" data-id="'+id+'" aria-label="Quitar uno">−</button><b>'+cart[id]+'</b><button data-a="inc" data-id="'+id+'" aria-label="Agregar uno"'+(cart[id]>=p.stock?" disabled":"")+'>+</button></div></div>'});
    h+='<div class="total"><span>Total</span><span>'+money(cartTotal())+'</span></div><div class="actions"><button class="btn primary" data-a="checkout" style="flex:1">Registrar venta</button><button class="btn" data-a="clear">Vaciar</button></div></div>';
  }
  return h;
}
function hist(){
  var tot=0,n=0;S.sales.forEach(function(s){if(!s.void){tot+=s.total;n++}});
  var h='<div class="stats"><div class="stat"><b>'+n+'</b><span>Ventas</span></div><div class="stat"><b>'+money(tot)+'</b><span>Total vendido</span></div></div>';
  if(!S.sales.length)return h+'<div class="empty">Todavía no registraste ventas.</div>';
  S.sales.slice().reverse().forEach(function(s){
    var d=new Date(s.date).toLocaleString("es",{dateStyle:"medium",timeStyle:"short"});
    h+='<div class="card sale"><div class="top"><span class="'+(s.void?"void":"")+'">'+money(s.total)+'</span><span class="meta">'+d+'</span></div><div class="meta '+(s.void?"void":"")+'">'+s.items.map(function(i){return i.qty+" × "+esc(i.name)}).join(", ")+'</div>'+
    (s.void?'<div class="meta">Anulada · el stock se devolvió</div>':'<div class="actions"><button class="btn sm danger" data-a="void" data-id="'+s.id+'">Anular y devolver stock</button></div>')+'</div>';
  });
  return h;
}

function exp(){
  var g=0,v=0;S.expenses.forEach(function(x){g+=x.amount});S.sales.forEach(function(s){if(!s.void)v+=s.total});
  var r=v-g;
  var h='<div class="stats"><div class="stat"><b>'+money(v)+'</b><span>Ventas</span></div><div class="stat"><b>'+money(g)+'</b><span>Gastos</span></div><div class="stat"><b'+(r<0?' style="color:var(--bad)"':'')+'>'+money(r)+'</b><span>Ventas menos gastos</span></div></div>';
  h+='<div class="row"><button class="btn primary" data-a="newexp" style="flex:1">Nuevo gasto</button></div>';
  if(!S.expenses.length)return h+'<div class="empty">Todavía no registraste gastos. Toca «Nuevo gasto» para cargar el primero.</div>';
  S.expenses.slice().sort(function(a,b){return b.date.localeCompare(a.date)}).forEach(function(x){
    var d=new Date(x.date+"T00:00").toLocaleDateString("es",{dateStyle:"medium"});
    h+='<div class="card item"><div><div class="name">'+esc(x.desc)+'</div><div class="meta">'+esc(x.cat)+' · '+d+'</div></div><div style="text-align:right"><div class="name">'+money(x.amount)+'</div><button class="btn sm danger" data-a="delexp" data-id="'+x.id+'" style="margin-top:4px">Eliminar</button></div></div>';
  });
  return h;
}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-tab],[data-a]");if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;q="";render();return}
  var a=t.dataset.a,id=t.dataset.id,p=id&&find(id);
  if(a==="new"){editId=null;$("#ptitle").textContent="Nuevo producto";$("#pform").reset();$("#pmin").value=3;$("#pdlg").showModal()}
  else if(a==="edit"&&p){editId=id;$("#ptitle").textContent="Editar producto";$("#pname").value=p.name;$("#pprice").value=p.price;$("#pstock").value=p.stock;$("#pmin").value=p.min;$("#pdlg").showModal()}
  else if(a==="restock"&&p){restockId=id;$("#rtitle").textContent="Agregar stock: "+p.name;$("#rform").reset();$("#rdlg").showModal()}
  else if(a==="del"&&p){if(confirm("¿Eliminar «"+p.name+"»? Las ventas pasadas se conservan.")){S.products=S.products.filter(function(x){return x.id!==id});delete cart[id];save();render()}}
  else if(a==="add"&&p){if((cart[id]||0)<p.stock){cart[id]=(cart[id]||0)+1;render()}}
  else if(a==="inc"&&p){if(cart[id]<p.stock){cart[id]++;render()}}
  else if(a==="dec"){cart[id]--;if(cart[id]<=0)delete cart[id];render()}
  else if(a==="clear"){cart={};render()}
  else if(a==="checkout"){
    var items=[];
    for(var k in cart){var pr=find(k);if(!pr)continue;if(cart[k]>pr.stock){toast("No hay stock suficiente de "+pr.name);return}items.push({id:k,name:pr.name,qty:cart[k],price:pr.price})}
    if(!items.length)return;
    items.forEach(function(i){find(i.id).stock-=i.qty});
    var total=items.reduce(function(s,i){return s+i.qty*i.price},0);
    S.sales.push({id:uid(),date:Date.now(),items:items,total:total,void:false});
    cart={};save();render();toast("Venta registrada: "+money(total));
  }
  else if(a==="newexp"){$("#eform").reset();$("#edate").value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);$("#edlg").showModal()}
  else if(a==="delexp"){if(confirm("¿Eliminar este gasto?")){S.expenses=S.expenses.filter(function(x){return x.id!==id});save();render()}}
  else if(a==="void"){
    var s=S.sales.find(function(x){return x.id===id});
    if(s&&!s.void&&confirm("¿Anular esta venta y devolver las unidades al stock?")){
      s.items.forEach(function(i){var pr=find(i.id);if(pr)pr.stock+=i.qty});
      s.void=true;save();render();toast("Venta anulada");
    }
  }
});
$("#pform").addEventListener("submit",function(e){
  if(e.submitter&&e.submitter.value!=="ok")return;
  var d={name:$("#pname").value.trim(),price:parseFloat($("#pprice").value)||0,stock:parseInt($("#pstock").value,10)||0,min:parseInt($("#pmin").value,10)||0};
  if(!d.name)return;
  if(editId){var p=find(editId);if(p)Object.assign(p,d)}else S.products.push(Object.assign({id:uid()},d));
  save();render();
});
$("#eform").addEventListener("submit",function(e){
  if(e.submitter&&e.submitter.value!=="ok")return;
  var a=parseFloat($("#eamt").value),d=$("#edesc").value.trim();
  if(!d||!(a>0))return;
  S.expenses.push({id:uid(),desc:d,cat:$("#ecat").value,amount:a,date:$("#edate").value});
  save();render();toast("Gasto registrado: "+money(a));
});
$("#rform").addEventListener("submit",function(e){
  if(e.submitter&&e.submitter.value!=="ok")return;
  var n=parseInt($("#rqty").value,10),p=find(restockId);
  if(p&&n>0){p.stock+=n;save();render();toast("+"+n+" en "+p.name)}
});
render();
setSync("Solo en este dispositivo");
$("#backup").onclick=function(){
  if(!window.claude||!claude.use){toast("No disponible aquí");return}
  claude.use("downloads").then(function(d){
    if(!d){toast("La descarga no está disponible");return}
    return d.save({filename:"stock-ventas-copia.json",data:JSON.stringify(S,null,2)});
  }).catch(function(){});
};
if(window.claude&&claude.use){
  claude.use("db").then(function(db){
    if(!db)return;
    var ref=db.doc("app/state"),first=true;
    ref.onSnapshot(function(snap){
      dbDoc=ref;
      if(snap.exists){
        var d=snap.data();
        S={products:JSON.parse(JSON.stringify(d.products||[])),sales:JSON.parse(JSON.stringify(d.sales||[])),expenses:JSON.parse(JSON.stringify(d.expenses||[]))};
        try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
        render();
      }else if(first&&(S.products.length||S.sales.length||S.expenses.length)){save();}
      first=false;
      setSync("Sincronizado entre dispositivos");
    },function(){setSync("Sin conexión: solo en este dispositivo")});
  }).catch(function(){});
}
})();
</script>
</body>
</html>
